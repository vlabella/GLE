#
# -- Setup Ghostscript on Windows.
#    Installs Ghostscript and optionally checks out GhostPDL sources.
#
name: Setup Ghostscript
description: Install Ghostscript and optionally checkout GhostPDL

inputs:
  checkout-ghostpdl:
    description: "Whether to checkout ArtifexSoftware/ghostpdl"
    required: false
    default: "false"

runs:
  using: composite

  steps:
    # GhostPDL sources/headers are only needed when building software
    # that links against GhostPDL.
    - name: Acquire GhostPDL
      if: ${{ inputs.checkout-ghostpdl == 'true' }}
      uses: actions/checkout@v7
      with:
        repository: ArtifexSoftware/ghostpdl
        path: ghostpdl

    - name: Install Ghostscript
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $maxAttempts = 3

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Host "Installing Ghostscript (attempt $attempt of $maxAttempts)..."

          choco install ghostscript `
            --yes `
            --no-progress `
            --limit-output

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Ghostscript installed successfully."
            break
          }

          if ($attempt -eq $maxAttempts) {
            throw "Ghostscript installation failed after $maxAttempts attempts."
          }

          $delay = 15 * $attempt
          Write-Warning "Chocolatey failed with exit code $LASTEXITCODE. Retrying in $delay seconds..."
          Start-Sleep -Seconds $delay
        }

    - name: Add Ghostscript to PATH
      shell: pwsh
      run: |
        $root = "C:\Program Files\gs"

        if (-not (Test-Path $root)) {
          throw "Ghostscript installation directory '$root' was not found."
        }

        $o = Get-ChildItem -Path $root -Directory |
             Where-Object { $_.Name -like "gs*" } |
             Sort-Object Name -Descending |
             Select-Object -First 1

        if (-not $o) {
          throw "Unable to locate installed Ghostscript version under '$root'."
        }

        $g = Join-Path $o.FullName "bin"

        if (-not (Test-Path $g)) {
          throw "Ghostscript bin directory '$g' was not found."
        }

        Write-Host "Ghostscript bin directory: $g"
        $g | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Ghostscript
      shell: cmd
      run: gswin64c --version